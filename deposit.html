<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit Money | Apex Reserve Bank</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="sidebar-backdrop"></div>

  <div class="app-wrapper">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="/dashboard" class="brand-logo">
          <div class="brand-icon"><i class="fas fa-landmark"></i></div>
          <span>Apex Reserve</span>
        </a>
      </div>
      <nav class="sidebar-menu" id="sidebar-menu-items"></nav>
      <div class="sidebar-footer">
        <button type="button" class="btn-logout" id="btn-logout">
          <i class="fas fa-arrow-right-from-bracket"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="menu-toggle-btn" id="menu-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="page-title">Deposit Money</h1>
        </div>
        <div class="topbar-right">
          <div class="current-date-badge">
            <i class="fas fa-calendar-day"></i>
            <span id="topbar-current-date">--</span>
          </div>
          <div class="user-profile-chip">
            <div class="user-avatar" id="topbar-user-avatar">U</div>
            <div class="user-meta">
              <span class="user-name" id="topbar-user-name">User</span>
              <span class="user-role-badge" id="topbar-user-role">CUSTOMER</span>
            </div>
          </div>
        </div>
      </header>

      <main class="page-content">
        <div class="form-card-container">
          <div class="card">
            <div class="card-header">
              <div>
                <h3 class="card-title"><i class="fas fa-circle-arrow-down" style="color: var(--success);"></i> Account Cash / Check Deposit</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
                  Simulate money deposits into your bank accounts with instant credit.
                </p>
              </div>
            </div>

            <form id="deposit-form">
              <div class="form-group">
                <label class="form-label" for="deposit-account-select">
                  Select Destination Account <span class="required">*</span>
                </label>
                <select id="deposit-account-select" class="form-control" required>
                  <option value="">-- Loading accounts --</option>
                </select>
                <div id="deposit-balance-preview" style="margin-top: 6px; font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">
                  Available Balance: <strong style="color: var(--primary);">₹0.00</strong>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="deposit-amount">
                  Deposit Amount (INR) <span class="required">*</span>
                </label>
                <div class="input-group">
                  <span class="input-prefix">₹</span>
                  <input type="number" id="deposit-amount" class="form-control with-prefix" placeholder="0.00" min="1" step="any" required>
                </div>
                <div class="amount-presets">
                  <button type="button" class="preset-chip" onclick="setDepositAmount(500)">+ ₹500</button>
                  <button type="button" class="preset-chip" onclick="setDepositAmount(1000)">+ ₹1,000</button>
                  <button type="button" class="preset-chip" onclick="setDepositAmount(5000)">+ ₹5,000</button>
                  <button type="button" class="preset-chip" onclick="setDepositAmount(10000)">+ ₹10,000</button>
                  <button type="button" class="preset-chip" onclick="setDepositAmount(25000)">+ ₹25,000</button>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="deposit-desc">Description / Reference Note</label>
                <div class="input-group">
                  <i class="fas fa-pencil input-icon"></i>
                  <input type="text" id="deposit-desc" class="form-control with-icon" placeholder="e.g. Salary Deposit, Cash Deposit">
                </div>
              </div>

              <div class="form-actions">
                <button type="button" class="btn btn-outline" onclick="history.back()">Cancel</button>
                <button type="submit" class="btn btn-primary" id="btn-submit-deposit">
                  <i class="fas fa-check"></i> <span>Confirm Deposit</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let userAccounts = [];

    document.addEventListener('DOMContentLoaded', async () => {
      initAppShell('deposit');
      await loadAccountsForDeposit();

      const form = document.getElementById('deposit-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const accId = document.getElementById('deposit-account-select').value;
        const amount = parseFloat(document.getElementById('deposit-amount').value);
        const desc = document.getElementById('deposit-desc').value.trim() || 'Manual Account Deposit';
        const submitBtn = document.getElementById('btn-submit-deposit');

        if (!accId || isNaN(amount) || amount <= 0) {
          showToast('Validation Error', 'Please select an account and specify an amount greater than ₹0.', 'warning');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

          const res = await apiRequest('/api/transactions/deposit', {
            method: 'POST',
            body: JSON.stringify({
              account_id: parseInt(accId, 10),
              amount,
              description: desc
            })
          });

          showToast('Deposit Succeeded', res.message, 'success');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1200);
        } catch (err) {
          showToast('Deposit Failed', err.message, 'danger');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-check"></i> <span>Confirm Deposit</span>';
        }
      });

      document.getElementById('deposit-account-select').addEventListener('change', updateBalanceDisplay);
    });

    async function loadAccountsForDeposit() {
      const select = document.getElementById('deposit-account-select');
      try {
        userAccounts = await apiRequest('/api/accounts');
        if (userAccounts.length === 0) {
          select.innerHTML = '<option value="">No active accounts available</option>';
          return;
        }
        select.innerHTML = userAccounts.map(a => `
          <option value="${a.account_id}">${a.masked_account_number || a.account_number} (${a.account_type}) - ${formatRupees(a.balance_rupees)}</option>
        `).join('');
        updateBalanceDisplay();
      } catch (err) {
        showToast('Error', err.message, 'danger');
      }
    }

    function updateBalanceDisplay() {
      const select = document.getElementById('deposit-account-select');
      const selectedId = parseInt(select.value, 10);
      const acc = userAccounts.find(a => a.account_id === selectedId);
      const preview = document.getElementById('deposit-balance-preview');
      if (acc && preview) {
        preview.innerHTML = `Available Balance: <strong style="color: var(--primary);">${formatRupees(acc.balance_rupees)}</strong> (${acc.status})`;
      }
    }

    function setDepositAmount(val) {
      document.getElementById('deposit-amount').value = val;
    }
  </script>
</body>
</html>
