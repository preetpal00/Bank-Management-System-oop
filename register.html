<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | Apex Reserve Bank</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-card" style="max-width: 580px;">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fas fa-user-plus"></i>
      </div>
      <h2 class="auth-title">Open Bank Account</h2>
      <p class="auth-subtitle">Join Apex Reserve Bank for modern digital services</p>
    </div>

    <form id="register-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="reg-name">
            Full Name <span class="required">*</span>
          </label>
          <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="reg-name" class="form-control with-icon" placeholder="e.g. Ramesh Kumar" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">
            Email Address <span class="required">*</span>
          </label>
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="reg-email" class="form-control with-icon" placeholder="ramesh@example.com" required>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="reg-phone">
            Phone Number <span class="required">*</span>
          </label>
          <div class="input-group">
            <i class="fas fa-phone input-icon"></i>
            <input type="tel" id="reg-phone" class="form-control with-icon" placeholder="+91 98765 00000" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-dob">
            Date of Birth <span class="required">*</span>
          </label>
          <div class="input-group">
            <i class="fas fa-calendar input-icon"></i>
            <input type="date" id="reg-dob" class="form-control with-icon" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-address">
          Residential Address <span class="required">*</span>
        </label>
        <div class="input-group">
          <i class="fas fa-location-dot input-icon"></i>
          <input type="text" id="reg-address" class="form-control with-icon" placeholder="Street, City, State, PIN code" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="reg-password">
            Password <span class="required">*</span>
          </label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="reg-password" class="form-control with-icon" placeholder="Min. 6 chars" required minlength="6">
            <button type="button" class="password-toggle-btn" data-target="reg-password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">
            Confirm Password <span class="required">*</span>
          </label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="reg-confirm-password" class="form-control with-icon" placeholder="Repeat password" required minlength="6">
            <button type="button" class="password-toggle-btn" data-target="reg-confirm-password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 14px; padding: 13px;">
        <span>Complete Registration</span> <i class="fas fa-check"></i>
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 0.88rem; color: var(--text-muted);">
      Already have an account? <a href="/login" style="font-weight: 600;">Sign In</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
