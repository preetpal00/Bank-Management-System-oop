<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fund Transfer | Apex Reserve Bank</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="sidebar-backdrop"></div>

  <div class="app-wrapper">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="/dashboard" class="brand-logo">
          <div class="brand-icon"><i class="fas fa-landmark"></i></div>
          <span>Apex Reserve</span>
        </a>
      </div>
      <nav class="sidebar-menu" id="sidebar-menu-items"></nav>
      <div class="sidebar-footer">
        <button type="button" class="btn-logout" id="btn-logout">
          <i class="fas fa-arrow-right-from-bracket"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="menu-toggle-btn" id="menu-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="page-title">Transfer Money</h1>
        </div>
        <div class="topbar-right">
          <div class="current-date-badge">
            <i class="fas fa-calendar-day"></i>
            <span id="topbar-current-date">--</span>
          </div>
          <div class="user-profile-chip">
            <div class="user-avatar" id="topbar-user-avatar">U</div>
            <div class="user-meta">
              <span class="user-name" id="topbar-user-name">User</span>
              <span class="user-role-badge" id="topbar-user-role">CUSTOMER</span>
            </div>
          </div>
        </div>
      </header>

      <main class="page-content">
        <div class="form-card-container">
          <div class="card">
            <div class="card-header">
              <div>
                <h3 class="card-title"><i class="fas fa-paper-plane" style="color: var(--secondary);"></i> Instant Inter-Account Fund Transfer</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
                  Transfer funds in real-time using atomic C++ SQL transaction architecture.
                </p>
              </div>
            </div>

            <!-- Fast Beneficiary Quick-Pills for Academic Viva / Demo -->
            <div style="background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 20px;">
              <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">
                <i class="fas fa-users"></i> Quick Sample Beneficiaries (Click to fill):
              </span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;">
                <button type="button" class="demo-btn" onclick="fillBeneficiary('ACC10010002')">
                  Priya Patel (ACC10010002)
                </button>
                <button type="button" class="demo-btn" onclick="fillBeneficiary('ACC10010003')">
                  Amit Verma (ACC10010003)
                </button>
                <button type="button" class="demo-btn" onclick="fillBeneficiary('ACC10010004')">
                  Sneha Reddy (ACC10010004)
                </button>
                <button type="button" class="demo-btn" onclick="fillBeneficiary('ACC10010005')">
                  Vikram Singh (ACC10010005)
                </button>
              </div>
            </div>

            <form id="transfer-form">
              <div class="form-group">
                <label class="form-label" for="transfer-sender-select">
                  From (Debit Account) <span class="required">*</span>
                </label>
                <select id="transfer-sender-select" class="form-control" required>
                  <option value="">-- Loading accounts --</option>
                </select>
                <div id="transfer-balance-preview" style="margin-top: 6px; font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">
                  Available Balance: <strong style="color: var(--primary);">₹0.00</strong>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="transfer-receiver-acc">
                  To (Beneficiary Account Number) <span class="required">*</span>
                </label>
                <div class="input-group">
                  <i class="fas fa-receipt input-icon"></i>
                  <input type="text" id="transfer-receiver-acc" class="form-control with-icon" placeholder="e.g. ACC10010002" required style="font-family: monospace; letter-spacing: 1px;">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="transfer-amount">
                  Transfer Amount (INR) <span class="required">*</span>
                </label>
                <div class="input-group">
                  <span class="input-prefix">₹</span>
                  <input type="number" id="transfer-amount" class="form-control with-prefix" placeholder="0.00" min="1" step="any" required>
                </div>
                <div class="amount-presets">
                  <button type="button" class="preset-chip" onclick="setTransferAmount(300)">₹300</button>
                  <button type="button" class="preset-chip" onclick="setTransferAmount(500)">₹500</button>
                  <button type="button" class="preset-chip" onclick="setTransferAmount(1000)">₹1,000</button>
                  <button type="button" class="preset-chip" onclick="setTransferAmount(5000)">₹5,000</button>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="transfer-desc">Remarks / Note</label>
                <div class="input-group">
                  <i class="fas fa-pencil input-icon"></i>
                  <input type="text" id="transfer-desc" class="form-control with-icon" placeholder="e.g. Rent, College Fees, Invoice Payment">
                </div>
              </div>

              <div class="form-actions">
                <button type="button" class="btn btn-outline" onclick="history.back()">Cancel</button>
                <button type="submit" class="btn btn-secondary" id="btn-submit-transfer">
                  <i class="fas fa-paper-plane"></i> <span>Send Payment</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let userAccounts = [];

    document.addEventListener('DOMContentLoaded', async () => {
      initAppShell('transfer');
      await loadAccountsForTransfer();

      const form = document.getElementById('transfer-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const senderId = document.getElementById('transfer-sender-select').value;
        const receiverAcc = document.getElementById('transfer-receiver-acc').value.trim();
        const amount = parseFloat(document.getElementById('transfer-amount').value);
        const desc = document.getElementById('transfer-desc').value.trim() || 'Online Fund Transfer';
        const submitBtn = document.getElementById('btn-submit-transfer');

        if (!senderId || !receiverAcc || isNaN(amount) || amount <= 0) {
          showToast('Validation Error', 'Please select source account, beneficiary account number, and amount.', 'warning');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing Atomic Transfer...';

          const res = await apiRequest('/api/transactions/transfer', {
            method: 'POST',
            body: JSON.stringify({
              sender_account_id: parseInt(senderId, 10),
              receiver_account_number: receiverAcc,
              amount,
              description: desc
            })
          });

          showToast('Transfer Succeeded', res.message, 'success');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1200);
        } catch (err) {
          showToast('Transfer Failed', err.message, 'danger');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> <span>Send Payment</span>';
        }
      });

      document.getElementById('transfer-sender-select').addEventListener('change', updateBalanceDisplay);
    });

    async function loadAccountsForTransfer() {
      const select = document.getElementById('transfer-sender-select');
      try {
        userAccounts = await apiRequest('/api/accounts');
        if (userAccounts.length === 0) {
          select.innerHTML = '<option value="">No active accounts available</option>';
          return;
        }
        select.innerHTML = userAccounts.map(a => `
          <option value="${a.account_id}">${a.masked_account_number || a.account_number} (${a.account_type}) - ${formatRupees(a.balance_rupees)}</option>
        `).join('');
        updateBalanceDisplay();
      } catch (err) {
        showToast('Error', err.message, 'danger');
      }
    }

    function updateBalanceDisplay() {
      const select = document.getElementById('transfer-sender-select');
      const selectedId = parseInt(select.value, 10);
      const acc = userAccounts.find(a => a.account_id === selectedId);
      const preview = document.getElementById('transfer-balance-preview');
      if (acc && preview) {
        preview.innerHTML = `Available Balance: <strong style="color: var(--primary);">${formatRupees(acc.balance_rupees)}</strong> (${acc.status})`;
      }
    }

    function setTransferAmount(val) {
      document.getElementById('transfer-amount').value = val;
    }

    function fillBeneficiary(accNum) {
      document.getElementById('transfer-receiver-acc').value = accNum;
    }
  </script>
</body>
</html>
