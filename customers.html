<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Management | Apex Reserve Bank</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="sidebar-backdrop"></div>

  <div class="app-wrapper">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="/dashboard" class="brand-logo">
          <div class="brand-icon"><i class="fas fa-landmark"></i></div>
          <span>Apex Reserve</span>
        </a>
      </div>
      <nav class="sidebar-menu" id="sidebar-menu-items"></nav>
      <div class="sidebar-footer">
        <button type="button" class="btn-logout" id="btn-logout">
          <i class="fas fa-arrow-right-from-bracket"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="menu-toggle-btn" id="menu-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="page-title">Customer Management</h1>
        </div>
        <div class="topbar-right">
          <div class="current-date-badge">
            <i class="fas fa-calendar-day"></i>
            <span id="topbar-current-date">--</span>
          </div>
          <div class="user-profile-chip">
            <div class="user-avatar" id="topbar-user-avatar">A</div>
            <div class="user-meta">
              <span class="user-name" id="topbar-user-name">Admin</span>
              <span class="user-role-badge" id="topbar-user-role">ADMIN</span>
            </div>
          </div>
        </div>
      </header>

      <main class="page-content">
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title"><i class="fas fa-users"></i> Registered Bank Customers</h3>
              <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
                Manage customer accounts, profiles, and access status.
              </p>
            </div>
            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
              <input type="text" id="customer-search" class="form-control" placeholder="Search customer..." style="width: 240px; padding: 8px 14px;">
              <button type="button" class="btn btn-primary" onclick="openModal('modal-add-customer')">
                <i class="fas fa-user-plus"></i> <span>Add Customer</span>
              </button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Customer ID</th>
                  <th>Full Name & Email</th>
                  <th>Phone Number</th>
                  <th>Accounts</th>
                  <th>Total Balance (INR)</th>
                  <th>Access Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="customers-tbody">
                <!-- Dynamically loaded -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Customer Modal -->
  <div class="modal-backdrop" id="modal-add-customer">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fas fa-user-plus"></i> Register New Customer</h3>
        <button type="button" class="modal-close-btn" onclick="closeModal('modal-add-customer')">&times;</button>
      </div>
      <form id="form-add-customer">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="add-cust-name">Full Name <span class="required">*</span></label>
              <input type="text" id="add-cust-name" class="form-control" required placeholder="Full Name">
            </div>
            <div class="form-group">
              <label class="form-label" for="add-cust-email">Email Address <span class="required">*</span></label>
              <input type="email" id="add-cust-email" class="form-control" required placeholder="name@example.com">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="add-cust-phone">Phone Number <span class="required">*</span></label>
              <input type="tel" id="add-cust-phone" class="form-control" required placeholder="+91 98765 00000">
            </div>
            <div class="form-group">
              <label class="form-label" for="add-cust-dob">Date of Birth <span class="required">*</span></label>
              <input type="date" id="add-cust-dob" class="form-control" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="add-cust-address">Residential Address</label>
            <input type="text" id="add-cust-address" class="form-control" placeholder="City, State">
          </div>

          <div class="form-group">
            <label class="form-label" for="add-cust-password">Initial Password</label>
            <input type="password" id="add-cust-password" class="form-control" placeholder="Default: Customer123!">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('modal-add-customer')">Cancel</button>
          <button type="submit" class="btn btn-primary"><span>Save Customer</span></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Customer Modal -->
  <div class="modal-backdrop" id="modal-edit-customer">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fas fa-user-pen"></i> Edit Customer Information</h3>
        <button type="button" class="modal-close-btn" onclick="closeModal('modal-edit-customer')">&times;</button>
      </div>
      <form id="form-edit-customer">
        <input type="hidden" id="edit-cust-id">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="edit-cust-name">Full Name <span class="required">*</span></label>
              <input type="text" id="edit-cust-name" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-cust-email">Email (Read Only)</label>
              <input type="email" id="edit-cust-email" class="form-control" disabled style="background: var(--bg-main);">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="edit-cust-phone">Phone Number</label>
              <input type="tel" id="edit-cust-phone" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-cust-dob">Date of Birth</label>
              <input type="date" id="edit-cust-dob" class="form-control">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-cust-address">Residential Address</label>
            <input type="text" id="edit-cust-address" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('modal-edit-customer')">Cancel</button>
          <button type="submit" class="btn btn-primary"><span>Update Customer</span></button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/customers.js"></script>
</body>
</html>
